name: Daily Power Reminder

on:
  schedule:
    # Runs every day at 12:52 UTC (6:22 AM IST)
    # Due to heavy traffic may cause delay
    # So, pulling the time back into a random minute in the previous hour 
    # will make the delay drop
    - cron: "52 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reminder bot
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/state.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update reminder state"
            git push
          fi